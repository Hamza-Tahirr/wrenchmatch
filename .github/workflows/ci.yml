name: CI

# A credential scan, typecheck, lint, the unit + integration suites on both database drivers
# (local SQLite and libSQL, the engine Turso runs) and a production build. The Playwright E2E
# suite needs a running app and Google Chrome, so it runs locally (npm run test:e2e), not here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Credential guard (no secrets in tracked files)
        run: node scripts/check-secrets.mjs --all

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests (SQLite)
        run: npm test

      - name: Integration tests on the libSQL driver (Turso engine)
        run: npm run test:libsql

      - name: Production build
        run: npm run build
